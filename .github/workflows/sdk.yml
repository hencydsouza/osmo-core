name: sdk
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  macos:
    needs: rust
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: Swatinem/rust-cache@v2
      - run: scripts/test-sdk-macos.sh
      - uses: actions/upload-artifact@v4
        with: { name: osmo-sdk-macos, path: dist/macos }

  android:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          scripts/build-sdk-android.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests on an x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: cd sdk-tests/android && ./gradlew :sdk:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with: { name: osmo-sdk-android, path: dist/android }

  windows:
    needs: rust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p osmo-ffi
      - run: cargo install uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag v0.9.1+v0.28.3
        continue-on-error: true
      - run: uniffi-bindgen-cs --library target/release/osmo_ffi.dll --out-dir dist/windows
        continue-on-error: true
      - run: Copy-Item target/release/osmo_ffi.dll dist/windows/
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: osmo-sdk-windows, path: dist/windows }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, android, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
      - run: |
          for d in osmo-sdk-*; do (cd "$d" && zip -r "../$d.zip" .); done
      - uses: softprops/action-gh-release@v2
        with: { files: "osmo-sdk-*.zip" }
