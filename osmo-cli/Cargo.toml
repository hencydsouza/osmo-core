[package]
name = "osmo-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "osmo"
path = "src/main.rs"

[dependencies]
osmo-core = { path = "../osmo-core" }
osmo-sdk = { path = "../osmo-sdk" }
btleplug = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
clap = { version = "4", features = ["derive"] }
directories = "5"
futures = "0.3"
dotenvy = "0.15.7"
ctrlc = { version = "3.5", features = ["termination"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
