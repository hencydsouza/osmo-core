[package]
name = "osmo-ffi"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "osmo_ffi"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
osmo-core = { path = "../osmo-core" }
osmo-sdk = { path = "../osmo-sdk" }
chrono = "0.4"
uniffi = { version = "0.29", features = ["cli"] }

[dev-dependencies]
tempfile = "3"
